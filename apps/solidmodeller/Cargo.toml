[package]
name = "solidmodeller"
description = "SolidModeller desktop app: 3D viewport and model browser, themed from Omarchy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sm-document.workspace = true
sm-format.workspace = true
sm-kernel.workspace = true
sm-step.workspace = true
truck-meshalgo = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
pollster = "0.4"
