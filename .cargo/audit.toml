# Advisories accepted for now, mirrored in the CI branch's deny.toml.
# vtkio comes in through truck-shapeops -> truck-meshalgo; nothing here reads
# or writes VTK files, so its vulnerable parsers are never reached.
# The truck crates leave with the OCCT backend (Oracle's kernel decision).
[advisories]
ignore = [
    "RUSTSEC-2026-0041", # lz4_flex via vtkio: VTK I/O is never used
    "RUSTSEC-2026-0194", # quick-xml via vtkio: VTK I/O is never used
    "RUSTSEC-2026-0195", # quick-xml via vtkio: VTK I/O is never used
    "RUSTSEC-2026-0196", # cgmath unmaintained: truck dependency
    "RUSTSEC-2026-0197", # cgmath swap_columns unsound: never called
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained: compile time only
]
