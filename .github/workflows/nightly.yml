# Long fuzz runs and a fresh advisory check, daily. Not a required check:
# a red run means a new finding (or a known one still open), which gets
# triaged into an issue rather than blocking unrelated pull requests.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }} (20 min)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [smp_read, smp_document, rebuild, step_read]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo fuzz build -O ${{ matrix.target }}
      - name: Fuzz
        run: |
          dict=""
          [ "${{ matrix.target }}" = smp_document ] && dict="-dict=fuzz/smp.dict"
          mkdir -p work && cp fuzz/corpus/${{ matrix.target }}/* work/ 2>/dev/null || true
          cargo fuzz run -O ${{ matrix.target }} work -- \
            -max_total_time=1200 -rss_limit_mb=2048 -timeout=10 -max_len=200000 $dict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  known-issues:
    name: replay open-issue reproducers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo fuzz build -O
      # Each file in fuzz/regressions reproduces an open finding. This job is
      # red until they are all fixed; then move them into fuzz/corpus.
      - name: Replay
        run: |
          status=0
          for dir in fuzz/regressions/*/; do
            target=$(basename "$dir")
            for input in "$dir"*; do
              if fuzz/target/x86_64-unknown-linux-gnu/release/$target \
                   -rss_limit_mb=2048 -timeout=20 "$input" > /dev/null 2>&1; then
                echo "FIXED: $input (move it into fuzz/corpus/$target)"
              else
                echo "STILL OPEN: $input"; status=1
              fi
            done
          done
          exit $status

  audit:
    name: cargo-audit (new advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
