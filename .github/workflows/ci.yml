# Required checks for every pull request into main. Branch protection only
# needs to require the final `ci-ok` job, which fails if any job fails.
#
# Third-party actions are pinned to commit SHAs (tag in the comment) so a
# moved tag can't change what runs here.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Packages the OpenCASCADE backend (decision K1) links against; installed
  # now so the Ubuntu jobs already test OCCT 7.6 when `sm-occt` lands.
  OCCT_APT: libocct-modeling-algorithms-dev libocct-data-exchange-dev libocct-ocaf-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      # --all-targets covers tests, benches and examples too.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  test:
    name: test (Ubuntu 24.04, OCCT 7.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenCASCADE
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $OCCT_APT
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Unit, integration and property tests; benches run once each as a smoke test.
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Property tests with more cases
        run: cargo test --workspace --test properties --locked --release
        env:
          PROPTEST_CASES: 1024

  arch:
    name: test (Arch Linux, the Omarchy base)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install toolchain and OpenCASCADE
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup opencascade
          rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --workspace --all-targets --locked

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-audit
      # Advisories, licenses, banned and duplicate crates, sources (deny.toml).
      - run: cargo deny --locked check
      # Same advisory database, second implementation; ignores are mirrored
      # in .cargo/audit.toml with the reasons kept in deny.toml.
      - run: cargo audit --deny warnings

  fuzz-smoke:
    name: fuzz smoke (60 s per target)
    runs-on: ubuntu-24.04
    env:
      # ruststep's `branches` dependency breaks on current nightly compilers,
      # so libFuzzer builds use stable with RUSTC_BOOTSTRAP for the -Z flags.
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo fuzz build -O
      # step_read is left to the nightly job: truck-stepio still has known
      # panics (fuzz/regressions/step_read) that would fail every PR.
      - name: Run targets
        run: |
          for target in smp_read smp_document rebuild; do
            dict=""
            [ "$target" = smp_document ] && dict="-dict=fuzz/smp.dict"
            cargo fuzz run -O "$target" "fuzz/corpus/$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -timeout=10 -max_len=200000 $dict
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, arch, docs, msrv, supply-chain, fuzz-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
