[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eltorr3s/solidmodeler"

[workspace.dependencies]
sm-document = { path = "crates/sm-document" }
sm-format = { path = "crates/sm-format" }
sm-kernel = { path = "crates/sm-kernel" }
sm-step = { path = "crates/sm-step" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
truck-modeling = "0.6"
truck-stepio = "0.3"
